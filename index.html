<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Delcom Blog — Tulisan yang layak dibaca pelan-pelan</title>
    <meta
      name="description"
      content="Delcom Blog: kumpulan artikel teknologi, pendidikan, gaya hidup, bisnis, dan opini dari para penulis Delcom. Baca gratis, tulis dengan editor Markdown dan asisten AI."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12110F" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Delcom Blog" />
    <meta property="og:description" content="Tulisan yang layak dibaca pelan-pelan." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Terapkan tema sebelum render pertama agar tidak berkedip.
      try {
        var mode = localStorage.getItem('delcom-theme')
        if (!mode) mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        if (mode === 'dark') document.documentElement.classList.add('dark')
        document.documentElement.setAttribute('data-accent', localStorage.getItem('delcom-accent') || 'vermilion')
      } catch (e) {
        document.documentElement.setAttribute('data-accent', 'vermilion')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Delcom Blog membutuhkan JavaScript untuk menampilkan artikel.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
